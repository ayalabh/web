<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Shape Modeler</title>
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/src/index.js",
      "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- Top Toolbar -->
  <div id="top-toolbar">
    <div class="toolbar-group" id="tools-group">
      <button id="tool-select" class="tool-btn active" data-tool="select" title="Select (S)">
        <img class="tool-icon" src="icons/mouse-pointer.svg" alt="Select">
        <span class="tool-label">Select</span>
      </button>
      <button id="tool-move" class="tool-btn" data-tool="move" title="Move (M)">
        <img class="tool-icon" src="icons/move.svg" alt="Move">
        <span class="tool-label">Move</span>
      </button>
      <button id="tool-rotate" class="tool-btn" data-tool="rotate" title="Rotate (R)">
        <img class="tool-icon" src="icons/rotate-cw.svg" alt="Rotate">
        <span class="tool-label">Rotate</span>
      </button>
      <button id="tool-scale" class="tool-btn" data-tool="scale" title="Scale (A)">
        <img class="tool-icon" src="icons/scaling.svg" alt="Scale">
        <span class="tool-label">Scale</span>
      </button>
      <button id="tool-camera" class="tool-btn" data-tool="camera" title="Camera (Ctrl+M)">
        <img class="tool-icon" src="icons/camera.svg" alt="Camera">
        <span class="tool-label">Camera</span>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group" id="actions-group">
      <button id="action-delete" class="tool-btn" disabled title="Delete (Del)">
        <img class="tool-icon" src="icons/trash.svg" alt="Delete">
        <span class="tool-label">Delete</span>
      </button>
      <button id="action-duplicate" class="tool-btn" disabled title="Duplicate (D)">
        <img class="tool-icon" src="icons/copy.svg" alt="Duplicate">
        <span class="tool-label">Duplicate</span>
      </button>
      <button id="action-texture" class="tool-btn" disabled title="Texture (T)">
        <img class="tool-icon" src="icons/image.svg" alt="Texture">
        <span class="tool-label">Texture</span>
      </button>
      <button id="action-color" class="tool-btn" disabled title="Color (L)">
        <img class="tool-icon" src="icons/palette.svg" alt="Color">
        <span class="tool-label">Color</span>
      </button>
      <button id="action-glow" class="tool-btn" disabled title="Toggle Glow (G)">
        <img class="tool-icon" src="icons/sparkles.svg" alt="Glow">
        <span class="tool-label">Glow</span>
      </button>
      <button id="action-hole" class="tool-btn" disabled title="Hole Mode (H)">
        <img class="tool-icon" src="icons/circle-minus.svg" alt="Hole">
        <span class="tool-label">Hole</span>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group" id="history-group">
      <button id="action-undo" class="tool-btn" title="Undo (Ctrl+Z)">
        <img class="tool-icon" src="icons/undo.svg" alt="Undo">
        <span class="tool-label">Undo</span>
      </button>
      <button id="action-redo" class="tool-btn" title="Redo (Ctrl+Shift+Z)">
        <img class="tool-icon" src="icons/redo.svg" alt="Redo">
        <span class="tool-label">Redo</span>
      </button>
      <button id="action-history" class="tool-btn" title="History (Shift+H)">
        <img class="tool-icon" src="icons/history.svg" alt="History">
        <span class="tool-label">History</span>
      </button>
      <button id="action-help" class="tool-btn" title="Help (?)">
        <img class="tool-icon" src="icons/help-circle.svg" alt="Help">
        <span class="tool-label">Help</span>
      </button>
    </div>

    <div class="toolbar-spacer"></div>

    <div class="toolbar-group" id="file-group">
      <button id="action-solid-floor" class="tool-btn" title="Solid Floor — prevent objects going below floor">
        <img class="tool-icon" src="icons/arrow-down-to-line.svg" alt="Solid Floor">
        <span class="tool-label">Clamp</span>
      </button>
      <button id="action-preview" class="tool-btn" title="Preview (P)">
        <img class="tool-icon" src="icons/eye.svg" alt="Preview">
        <span class="tool-label">Preview</span>
      </button>
      <button id="action-save" class="tool-btn" title="Save (Ctrl+S)">
        <img class="tool-icon" src="icons/save.svg" alt="Save">
        <span class="tool-label">Save</span>
      </button>
      <button id="action-open" class="tool-btn" title="Open (Ctrl+O)">
        <img class="tool-icon" src="icons/folder-open.svg" alt="Open">
        <span class="tool-label">Open</span>
      </button>
      <button id="action-export" class="tool-btn" title="Export (Ctrl+E)">
        <img class="tool-icon" src="icons/download.svg" alt="Export">
        <span class="tool-label">Export</span>
      </button>
      <button id="action-theme" class="tool-btn" title="Toggle Theme (Ctrl+Q)">
        <img class="tool-icon" id="theme-icon" src="icons/sun.svg" alt="Theme">
        <span class="tool-label">Theme</span>
      </button>
    </div>
  </div>

  <!-- Main Area -->
  <div id="main-area">
    <!-- Left Toolbar -->
    <div id="left-toolbar">
      <div id="left-toolbar-content">
        <button class="shape-btn" data-shape="cylinder" title="Cylinder (C)">
          <img class="shape-icon" src="icons/cylinder.svg" alt="Cylinder">
          <span class="shape-label">Cylinder</span>
        </button>
        <button class="shape-btn" data-shape="sphere" title="Ball (B)">
          <img class="shape-icon" src="icons/globe.svg" alt="Ball">
          <span class="shape-label">Ball</span>
        </button>
        <button class="shape-btn" data-shape="box" title="Cube (U)">
          <img class="shape-icon" src="icons/box.svg" alt="Cube">
          <span class="shape-label">Cube</span>
        </button>
        <button class="shape-btn" data-shape="cone" title="Cone (O)">
          <img class="shape-icon" src="icons/cone.svg" alt="Cone">
          <span class="shape-label">Cone</span>
        </button>
        <button class="shape-btn" id="draw-btn" title="Draw Shape (Shift+D)">
          <img class="shape-icon" src="icons/pencil.svg" alt="Draw">
          <span class="shape-label">Draw</span>
        </button>

        <div class="left-toolbar-divider"></div>

        <button class="shape-btn" id="action-brush" title="Brush (K)">
          <img class="shape-icon" src="icons/brush.svg" alt="Brush">
          <span class="shape-label">Brush</span>
        </button>

        <div class="left-toolbar-divider"></div>

        <button class="shape-btn" id="floor-color-btn" title="Floor Color (right-click to reset)">
          <img class="shape-icon" src="icons/paintbrush.svg" alt="Floor Color">
          <span class="shape-label">Floor</span>
        </button>
        <button class="shape-btn" id="wall-color-btn" title="Wall Color (right-click to reset)">
          <img class="shape-icon" src="icons/paintbrush.svg" alt="Wall Color">
          <span class="shape-label">Wall</span>
        </button>

        <div class="left-toolbar-divider"></div>

        <button class="shape-btn" id="light-btn" title="Scene Light">
          <img class="shape-icon" src="icons/lightbulb.svg" alt="Light">
          <span class="shape-label">Light</span>
        </button>
      </div>
      <button id="left-toolbar-toggle" title="Toggle sidebar">◀</button>
    </div>

    <!-- Workspace -->
    <div id="workspace">
      <canvas id="three-canvas"></canvas>
    </div>
  </div>

  <!-- Hidden color inputs -->
  <input type="color" id="color-picker-input" value="#cccccc" style="display:none;">
  <input type="color" id="floor-color-input" value="#2a2a2a" style="display:none;">
  <input type="color" id="wall-color-input" value="#0a0a1a" style="display:none;">

  <!-- Light Settings Panel -->
  <div id="light-panel" class="panel hidden" style="left: 10px; right: auto;">
    <div class="panel-header">
      <h3>Scene Light</h3>
      <button class="panel-close">&times;</button>
    </div>
    <div style="padding: 12px;">
      <label style="display:block; font-size:12px; margin-bottom:8px;">
        Intensity
        <input type="range" id="light-intensity" min="0" max="3" step="0.1" value="0.8" style="width:100%;">
      </label>
      <label style="display:block; font-size:12px;">
        Color
        <input type="color" id="light-color" value="#ffffff" style="width:100%; height:30px; border:none; cursor:pointer;">
      </label>
    </div>
  </div>

  <!-- Preview Mode Overlay -->
  <div id="preview-overlay" class="hidden">
    <div id="preview-controls">
      <button id="preview-screenshot" class="preview-btn" title="Take Screenshot">
        <img class="tool-icon" src="icons/camera.svg" alt="Screenshot">
        <span>Screenshot</span>
      </button>
      <button id="preview-exit" class="preview-btn" title="Exit Preview">
        <img class="tool-icon" src="icons/x.svg" alt="Exit">
        <span>Exit</span>
      </button>
    </div>
  </div>

  <!-- Texture Gallery Modal -->
  <div id="texture-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Texture Gallery</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div id="texture-grid" class="texture-grid"></div>
    </div>
  </div>

  <!-- History Panel -->
  <div id="history-panel" class="panel hidden">
    <div class="panel-header">
      <h3>History</h3>
      <button class="panel-close">&times;</button>
    </div>
    <div id="history-list" class="history-list"></div>
  </div>

  <!-- Open Project Dialog -->
  <div id="open-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Open Project</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div id="project-list" class="project-list"></div>
    </div>
  </div>

  <!-- Brush Panel -->
  <div id="brush-panel" class="panel hidden" style="left: 80px; top: 62px; right: auto; width: 200px;">
    <div class="panel-header">
      <h3>Brush</h3>
      <button class="panel-close">&times;</button>
    </div>
    <div style="padding: 12px;">
      <label style="display:block; font-size:12px; margin-bottom:8px;">
        Color
        <input type="color" id="brush-color" value="#ff0000" style="width:100%; height:30px; border:none; cursor:pointer;">
      </label>
      <label style="display:block; font-size:12px; margin-bottom:8px;">
        Size <span id="brush-size-label">10</span>
        <input type="range" id="brush-size" min="2" max="40" value="10" style="width:100%;">
      </label>
      <div style="font-size:12px; margin-bottom:6px;">Stamps</div>
      <div id="stamp-grid"></div>
    </div>
  </div>

  <!-- Draw Shape Modal -->
  <div id="draw-modal" class="modal hidden">
    <div class="modal-content draw-modal-content">
      <div class="modal-header">
        <h3>Draw a Shape</h3>
        <button class="modal-close">&times;</button>
      </div>
      <canvas id="draw-canvas" width="500" height="500"></canvas>
      <div class="draw-actions">
        <button id="draw-clear" class="draw-action-btn">Clear</button>
        <div class="toolbar-spacer"></div>
        <button id="draw-cancel" class="draw-action-btn">Cancel</button>
        <button id="draw-done" class="draw-action-btn draw-done-btn">Done</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
